<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="app-version" content="20260921-plan-03">
  <meta name="theme-color" content="#fdfaf6">
  <meta name="description" content="马来西亚五天四夜行程手册（2026.10.02 – 10.06）｜吉隆坡 × 马六甲">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Malaysia Trip">
  <title>Malaysia Trip · 马来西亚五天四夜</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=20260921-plan-03">
</head>
<body>

  <!-- 顶部功能标签（sticky，行程 / 地图） -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <span class="topbar-brand" aria-hidden="true">Malaysia</span>
      <div class="topbar-tabs" role="tablist" aria-label="页面标签">
        <button class="tab-btn tab-btn--active" id="tabItinerary" role="tab" aria-selected="true">行程</button>
        <button class="tab-btn" id="tabMap" role="tab" aria-selected="false">地图</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" aria-label="行程概览">
    <div class="hero-bg" aria-hidden="true">
      <img src="img/petronas-towers.webp" alt="" class="hero-bg-img" onerror="this.src='img/hero.webp';this.onerror=null">
    </div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="hero-date">2026.10.02 – 2026.10.06</p>
      <h1 class="hero-title">Malaysia Trip</h1>
      <p class="hero-sub">马来西亚五天四夜 · 吉隆坡 × 马六甲 × 波德申</p>
    </div>
  </section>

  <main class="main-content">

    <!-- ===================== 行程 Tab（内容由 app.js 从 data.js 渲染） ===================== -->
    <div class="tab-content active" id="tabContentItinerary" role="tabpanel">
      <!-- 酒店信息卡片（固定顶部） -->
      <div id="hotelCard"></div>
    </div>

    <!-- ===================== 地图 Tab ===================== -->
    <div class="tab-content" id="tabContentMap" role="tabpanel">
      <section class="map-panel">
        <div class="map-header">
          <h2 class="map-title">马来西亚路线</h2>
          <p class="map-hint">仅显示马来西亚行程。实线为 Grab，虚线为步行；公共交通请查看当天说明。</p>
        </div>
        <div class="map-filter" id="mapFilter" role="group" aria-label="按日期筛选">
          <button class="filter-btn filter-btn--active" data-day="all">全部</button>
          <button class="filter-btn" data-day="1">D1</button>
          <button class="filter-btn" data-day="2">D2</button>
          <button class="filter-btn" data-day="3">D3</button>
          <button class="filter-btn" data-day="4">D4</button>
          <button class="filter-btn" data-day="5">D5</button>
        </div>
        <label class="optional-toggle"><input type="checkbox" id="mapOptionalToggle" checked> <span>显示可选景点</span></label>
        <div id="map" class="map"></div>
        <details id="mapFallback" class="map-route-list">
          <summary>查看文字路线（无需地图服务）</summary>
          <div class="map-fallback-head">
            <p id="mapFallbackStatus">地图不可用时，也可以按这里的顺序出行。</p>
          </div>
          <div id="mapFallbackRoutes"></div>
        </details>
        <p class="map-offline-hint" id="mapOfflineHint" hidden>地图瓦片暂时不可用（可能离线），行程文字不受影响。</p>
      </section>
    </div><!-- /地图 tab -->

  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottomNav" aria-label="日期导航">
    <a href="#d1" data-day="1">D1</a>
    <a href="#d2" data-day="2">D2</a>
    <a href="#d3" data-day="3">D3</a>
    <a href="#d4" data-day="4">D4</a>
    <a href="#d5" data-day="5">D5</a>
  </nav>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js?v=20260921-plan-03"></script>
  <script src="js/map.js?v=20260921-plan-03"></script>
  <script src="js/app.js?v=20260921-plan-03"></script>
</body>
</html>
