<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdfaf6">
  <meta name="description" content="马来西亚五天四夜行程手册（2026.10.02 – 10.06）｜吉隆坡 × 马六甲">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Malaysia Trip">
  <title>Malaysia Trip · 马来西亚五天四夜</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部功能标签（sticky，行程 / 地图） -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <span class="topbar-brand" aria-hidden="true">Malaysia</span>
      <div class="topbar-tabs" role="tablist" aria-label="页面标签">
        <button class="tab-btn tab-btn--active" id="tabItinerary" role="tab" aria-selected="true">行程</button>
        <button class="tab-btn" id="tabMap" role="tab" aria-selected="false">地图</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" aria-label="行程概览">
    <div class="hero-bg" aria-hidden="true">
      <svg viewBox="0 0 1600 520" preserveAspectRatio="xMidYMax slice" focusable="false">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0c1b2e"/>
            <stop offset="0.55" stop-color="#17324d"/>
            <stop offset="0.85" stop-color="#2c4a52"/>
            <stop offset="1" stop-color="#4a3b2a"/>
          </linearGradient>
          <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d4a373" stop-opacity="0"/>
            <stop offset="1" stop-color="#e8b877" stop-opacity="0.55"/>
          </linearGradient>
        </defs>
        <rect width="1600" height="520" fill="url(#sky)"/>
        <circle cx="1280" cy="150" r="120" fill="#e8b877" opacity="0.10"/>
        <circle cx="1280" cy="150" r="70" fill="#e8b877" opacity="0.14"/>
        <rect y="320" width="1600" height="200" fill="url(#glow)"/>
        <g fill="#08121f" opacity="0.9">
          <g>
            <rect x="740" y="170" width="66" height="230" rx="4"/>
            <rect x="806" y="170" width="66" height="230" rx="4"/>
            <path d="M748 176 h50 v-60 l-25 -34 -25 34 z"/>
            <path d="M814 176 h50 v-60 l-25 -34 -25 34 z"/>
            <rect x="771" y="150" width="6" height="20"/>
            <rect x="837" y="150" width="6" height="20"/>
            <rect x="806" y="250" width="66" height="12" rx="6"/>
          </g>
          <rect x="560" y="270" width="70" height="130" rx="3"/>
          <rect x="640" y="240" width="55" height="160" rx="3"/>
          <rect x="880" y="260" width="80" height="140" rx="3"/>
          <rect x="970" y="290" width="60" height="110" rx="3"/>
          <rect x="1040" y="250" width="48" height="150" rx="3"/>
          <rect x="460" y="300" width="70" height="100" rx="3"/>
          <rect x="300" y="320" width="90" height="80" rx="3"/>
          <rect x="1180" y="310" width="80" height="90" rx="3"/>
          <rect x="1280" y="290" width="60" height="110" rx="3"/>
          <path d="M 705 400 h26 l-13 -150 z"/>
          <path d="M 707 252 h22 l-4 -26 h-14 z"/>
        </g>
      </svg>
    </div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="hero-date">2026.10.02 – 2026.10.06</p>
      <h1 class="hero-title">Malaysia Trip</h1>
      <p class="hero-sub">马来西亚五天四夜</p>
    </div>
  </section>

  <main class="main-content">

    <!-- ===================== 行程 Tab（内容由 app.js 从 data.js 渲染） ===================== -->
    <div class="tab-content active" id="tabContentItinerary" role="tabpanel"></div>

    <!-- ===================== 地图 Tab ===================== -->
    <div class="tab-content" id="tabContentMap" role="tabpanel">
      <section class="map-panel">
        <div class="map-header">
          <h2 class="map-title">路线总览</h2>
          <p class="map-hint">实线 = 建议 Grab 路段；虚线 = 步行路段。KLIA Ekspres、MRT/LRT 与长途巴士不画公路线，以标记与交通卡说明表示。</p>
        </div>
        <div class="map-filter" id="mapFilter" role="group" aria-label="按日期筛选">
          <button class="filter-btn filter-btn--active" data-day="all">全部</button>
          <button class="filter-btn" data-day="1">D1</button>
          <button class="filter-btn" data-day="2">D2</button>
          <button class="filter-btn" data-day="3">D3</button>
          <button class="filter-btn" data-day="4">D4</button>
          <button class="filter-btn" data-day="5">D5</button>
        </div>
        <div id="map" class="map"></div>
        <p class="map-offline-hint" id="mapOfflineHint" hidden>地图瓦片暂时不可用（可能离线），行程文字不受影响。</p>
      </section>
    </div><!-- /地图 tab -->

  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottomNav" aria-label="日期导航">
    <a href="#d1" data-day="1">D1</a>
    <a href="#d2" data-day="2">D2</a>
    <a href="#d3" data-day="3">D3</a>
    <a href="#d4" data-day="4">D4</a>
    <a href="#d5" data-day="5">D5</a>
  </nav>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
